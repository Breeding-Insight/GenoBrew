name: Deploy Golem App to shinyapps.io

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.3.0'
        
    - name: Setup pandoc
      uses: r-lib/actions/setup-pandoc@v2
      
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libharfbuzz-dev libfribidi-dev
        
    - name: Cache R packages
      uses: actions/cache@v3
      with:
        path: ${{ env.R_LIBS_USER }}
        key: ${{ runner.os }}-r-${{ hashFiles('DESCRIPTION') }}
        restore-keys: ${{ runner.os }}-r-
        
    - name: Install dependencies
      run: |
        install.packages(c("remotes", "rsconnect"))
        remotes::install_deps(dependencies = TRUE)
      shell: Rscript {0}
      
    - name: Install package
      run: R CMD INSTALL .
      
    - name: Deploy to shinyapps.io
      run: |
        rsconnect::setAccountInfo(
          name = "${{ secrets.SHINYAPPS_NAME }}",
          token = "${{ secrets.SHINYAPPS_TOKEN }}",
          secret = "${{ secrets.SHINYAPPS_SECRET }}"
        )
        rsconnect::deployApp(
          appDir = ".",
          appFiles = c(
            "R/",
            "inst/",
            "DESCRIPTION",
            "NAMESPACE",
            "app.R"
          ),
          forceUpdate = TRUE
        )
      shell: Rscript {0}