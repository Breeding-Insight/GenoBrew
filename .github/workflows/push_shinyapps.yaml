name: Deploy Golem App to shinyapps.io

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.3.0'
        
    - name: Setup pandoc
      uses: r-lib/actions/setup-pandoc@v2
      
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libharfbuzz-dev libfribidi-dev
        
    - name: Install dependencies
      run: |
        install.packages(c("remotes", "rsconnect"))
        remotes::install_deps(dependencies = TRUE)
      shell: Rscript {0}
      
    - name: Install package
      run: R CMD INSTALL .
      
    - name: Debug and deploy
      run: |
        # Debug: Check if secrets exist (without printing values)
        cat("Checking secrets...\n")
        cat("Name length:", nchar(Sys.getenv("SHINYAPPS_NAME")), "\n")
        cat("Token length:", nchar(Sys.getenv("SHINYAPPS_TOKEN")), "\n")
        cat("Secret length:", nchar(Sys.getenv("SHINYAPPS_SECRET")), "\n")
        
        # Remove any potential whitespace
        name <- trimws(Sys.getenv("SHINYAPPS_NAME"))
        token <- trimws(Sys.getenv("SHINYAPPS_TOKEN"))
        secret <- trimws(Sys.getenv("SHINYAPPS_SECRET"))
        
        # Set account info
        rsconnect::setAccountInfo(
          name = name,
          token = token,
          secret = secret
        )
        
        # List accounts to verify
        accounts <- rsconnect::accounts()
        print(accounts)
        
        # Deploy
        rsconnect::deployApp(
          appDir = ".",
          forceUpdate = TRUE
        )
      shell: Rscript {0}
      env:
        SHINYAPPS_NAME: ${{ secrets.SHINYAPPS_NAME }}
        SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
        SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}